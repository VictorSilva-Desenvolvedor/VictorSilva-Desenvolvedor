# Caminho no repositório: .github/workflows/metrics.yml
# Gera um único card de estatísticas como SVG dentro do próprio repositório.

name: Generate Metrics

on:
  schedule:
    # Todo dia às 03:00 UTC (00:00 em Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Gerar card de estatísticas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VictorSilva-Desenvolvedor
          filename: metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo

          # Só header e atividade: remove os blocos cheios de zeros
          base: header, activity

          # Linguagens no mesmo card
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          # Resumo do último ano de commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
